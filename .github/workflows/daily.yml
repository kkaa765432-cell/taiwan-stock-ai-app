name: Daily Stock AI Analysis

on:
  schedule:
    # 每天 UTC 09:30 執行 (台灣時間下午 17:30)
    - cron: '30 9 * * 1-5'
  workflow_dispatch: # 允許在 GitHub 網頁手動點擊按鈕隨時執行測試

jobs:
  run-analyzer:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出專案程式碼 (Checkout code)
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 執行台股 AI 盤後分析腳本
        env:
          SUPABASE_URL: ${{ https://cbmcyytotffgadoyajcv.supabase.co }}
          SUPABASE_KEY: ${{ sb_publishable_wUUVVdZj4DCZeqXTOscLTg_v_sQxBi8 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main/app.py
