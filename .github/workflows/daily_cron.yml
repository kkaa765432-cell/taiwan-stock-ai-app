name: Daily Stock Analysis Cron

on:
  schedule:
    # UTC 時間 09:30 等於 台灣時間 下午 17:30
    - cron: '30 9 * * 1-5'
  workflow_dispatch: # 支援手動觸發

jobs:
  fetch-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/python-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install yfinance pandas supabase google-generativeai requests beautifulsoup4

      - name: Run Auto Fetch & AI Learning
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python cron_fetch.py
